<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحه یافت نشد - استزلی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Vazirmatn', sans-serif; }
    body {
      background: linear-gradient(135deg, #080C12 0%, #0D1117 100%);
      min-height: 100vh;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(59,130,246,0.3); }
      50% { text-shadow: 0 0 40px rgba(59,130,246,0.6); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .counter-ring {
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      animation: countdown 3s linear forwards;
    }
    @keyframes countdown {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body class="flex items-center justify-center p-5">

  <div class="max-w-lg w-full text-center relative">
    
    <!-- Glitch Effect 404 -->
    <div class="relative mb-8 animate-float">
      <h1 class="text-[120px] sm:text-[160px] font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-400 to-blue-500 animate-glow" 
          style="-webkit-text-stroke: 2px rgba(59,130,246,0.3);">
        404
      </h1>
      <div class="absolute inset-0 flex items-center justify-center opacity-20 blur-sm">
        <h1 class="text-[120px] sm:text-[160px] font-black text-blue-500 select-none">404</h1>
      </div>
    </div>

    <!-- Message -->
    <div class="space-y-4 mb-10">
      <h2 class="text-2xl sm:text-3xl font-bold text-white">صفحه‌ای که دنبالش بودی پیدا نشد! 🔍</h2>
      <p class="text-gray-400 text-sm sm:text-base">
        ممکنه صفحه حذف شده باشه یا آدرس رو اشتباه وارد کرده باشی.
      </p>
      <div class="flex items-center justify-center gap-2 text-gray-500 text-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>خطای 404 - صفحه ناموجود</span>
      </div>
    </div>

    <!-- Countdown Redirect -->
    <div class="bg-gray-900/50 backdrop-blur-sm border border-gray-800 rounded-2xl p-6 mb-8">
      <div class="relative w-20 h-20 mx-auto mb-4">
        <svg class="w-20 h-20 transform -rotate-90">
          <circle cx="40" cy="40" r="36" stroke="#1F2937" stroke-width="4" fill="none"/>
          <circle class="counter-ring" cx="40" cy="40" r="36" stroke="#3B82F6" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span id="countdown-number" class="text-2xl font-bold text-blue-400">۳</span>
        </div>
      </div>
      <p class="text-gray-400 text-sm">
        در حال انتقال به صفحه اصلی...
      </p>
      <div class="mt-3 h-1 bg-gray-800 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 w-full transition-all duration-1000" style="width: 0%"></div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="index.html" class="btn-primary inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-8H9v8H5a2 2 0 0 1-2-2z"/></svg>
        صفحه اصلی
      </a>
      <button onclick="history.back()" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl font-semibold transition-all text-gray-300">
        ← بازگشت به صفحه قبل
      </button>
    </div>

    <!-- Footer Text -->
    <p class="mt-12 text-gray-600 text-xs">
      استزلی • مدیریت هوشمند دارایی‌ها
    </p>
  </div>

  <script>
    let countdown = 3;
    const countdownEl = document.getElementById('countdown-number');
    const progressBar = document.getElementById('progress-bar');
    
    const interval = setInterval(() => {
      countdown--;
      countdownEl.textContent = countdown;
      progressBar.style.width = `${((3 - countdown) / 3) * 100}%`;
      
      if (countdown <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>

  <style>
    .btn-primary {
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      box-shadow: 0 0 15px rgba(59,130,246,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(59,130,246,0.5);
    }
  </style>
</body>
</html>
